version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: xingyukun-db
    environment:
      POSTGRES_USER: ${DB_USER:-xingyukun}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xingyukun@123}
      POSTGRES_DB: ${DB_NAME:-xingyukun}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xingyukun}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xingyukun-network
    restart: unless-stopped

  # Redis 缓存
  cache:
    image: redis:7-alpine
    container_name: xingyukun-cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis@123}
    volumes:
      - cache_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xingyukun-network
    restart: unless-stopped

  # 主应用
  app:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: xingyukun-app
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${DB_USER:-xingyukun}:${DB_PASSWORD:-xingyukun@123}@db:5432/${DB_NAME:-xingyukun}
      SQL_ECHO: ${SQL_ECHO:-false}

      # 缓存配置
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis@123}
      REDIS_DB: 0

      # JWT 配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}

      # 服务器配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      WORKERS: ${WORKERS:-4}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # 心链核配置
      HEARTLINK_HOST: localhost
      HEARTLINK_PORT: 9999

      # 国产化配置
      USE_NATIONAL_CRYPTO: ${USE_NATIONAL_CRYPTO:-true}
      USE_NATIONAL_DATABASE: ${USE_NATIONAL_DATABASE:-false}
      USE_NATIONAL_OS: ${USE_NATIONAL_OS:-false}

      # 合规配置
      DATA_RESIDENCY: ${DATA_RESIDENCY:-china}
      ENABLE_ENCRYPTION: ${ENABLE_ENCRYPTION:-true}
      ENABLE_AUDIT_LOG: ${ENABLE_AUDIT_LOG:-true}

      # CORS 配置
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:*}

    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8000}:8000"

    volumes:
      - app_logs:/app/logs
      - ./config:/app/config

    networks:
      - xingyukun-network

    restart: unless-stopped

    # 进程管理（可选）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:latest
    container_name: xingyukun-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - xingyukun-network
    restart: unless-stopped

networks:
  xingyukun-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  cache_data:
    driver: local
  app_logs:
    driver: local
